<!DOCTYPE html>

<html lang="en">

<head>

    <meta property="og:title" content="{{NAME}}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{DOMAIN}}">
    <meta property="og:image:width" content="192">
    <meta property="og:image:height" content="192">
    <meta property="og:image" content="{{DOMAIN}}/{{FILE_NAME}}.{{IMAGE_EXTENSION_TYPE}}">

    <meta charset="UTF-8">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{NAME}}</title>

    <link rel="manifest" href="site.webmanifest">
    <link rel="canonical" href="{{DOMAIN}}">

    <!-- favicon start here -->
    <link rel="icon" type="image/{{IMAGE_EXTENSION_TYPE}}" sizes="16x16"
        href="{{DOMAIN}}/{{FILE_NAME}}_16_x_16.{{IMAGE_EXTENSION_TYPE}}">
    <link rel="icon" type="image/{{IMAGE_EXTENSION_TYPE}}" sizes="32x32"
        href="{{DOMAIN}}/{{FILE_NAME}}_32_x_32.{{IMAGE_EXTENSION_TYPE}}">
    <link rel="icon" type="image/{{IMAGE_EXTENSION_TYPE}}" sizes="48x48"
        href="{{DOMAIN}}/{{FILE_NAME}}_48_x_48.{{IMAGE_EXTENSION_TYPE}}">
    <link rel="icon" type="image/{{IMAGE_EXTENSION_TYPE}}" sizes="192x192"
        href="{{DOMAIN}}/{{FILE_NAME}}_192_x_192.{{IMAGE_EXTENSION_TYPE}}">
    <link rel="apple-touch-icon" type="image/{{IMAGE_EXTENSION_TYPE}}" sizes="192x192"
        href="{{DOMAIN}}/{{FILE_NAME}}_192_x_192.{{IMAGE_EXTENSION_TYPE}}">
    <!-- favicon end here -->

    <!-- favicon start here -->
    <link rel="icon" href="assets/media/png/favicon.png">
    <!-- favicon end here -->

    <!-- external css start here -->
    <link rel="stylesheet" href="assets/css/layout/_layout.css">
    <link rel="stylesheet" href="assets/css/main.css">
    <!-- external css end here -->

    <!-- schema.org start here -->
    <script type="application/ld+json">
        {
            "name": "{{NAME}}",
            "@type": "Organization",
            "url": "{{DOMAIN}}",
            "@context": "https://schema.org",
            "logo": "{{DOMAIN}}/{{FILE_NAME}}_192_x_192.{{IMAGE_EXTENSION_TYPE}}",
            "alternateName": ["{{NAME}}", "led-vision"]
        }
    </script>
    <!-- schema.org end here -->

    <!-- external js start here -->
    <script type="module" src="assets/js/main.js"></script>
    <!-- external js end here -->

</head>

<body>

    <header>
        <nav class="navigation">
            <div class="container">
                <div class="navigation__wrapper">
                    <div class="brand-logo">
                        <h1 class="brand-logo__label">
                            <a href="" class="brand-logo__link">
                                <span class="brand-logo__word">led</span>
                                <span class="brand-logo__word">vision</span>
                            </a>
                        </h1>
                    </div>

                    <menu class="navigation-menu">
                        <li class="navigation-menu__item"></li>
                        <li class="navigation-menu__item"></li>
                        <li class="navigation-menu__item"></li>
                    </menu>

                    <ul class="navigation-list"></ul>
                </div>
            </div>
        </nav>
    </header>

    <main>
        <div class="hero">
            <!-- <video class="hero__video" autoplay muted loop>
                <source src="assets/media/mp4/gold_background.mp4" type="video/mp4">
            </video> -->
        </div>
    </main>

    <section id="services" class="service">
        <div class="container">
            <h1 class="service__heading">services</h1>
            <ul class="service__list"></ul>
        </div>
    </section>

    <section id="our-solutions" class="our-solution">
        <div class="container">
            <h1 class="our-solution__heading">our solutions</h1>
            <ul class="our-solution__list"></ul>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer__wrapper">

                <div class="footer-brand">
                    <div class="brand-logo">
                        <h1 class="brand-logo__label">
                            <a href="" class="brand-logo__link">
                                <span class="brand-logo__word">led</span>
                                <span class="brand-logo__word">vision</span>
                            </a>
                        </h1>
                    </div>
                    <p class="footer-brand__decription">
                        Your partner for professional LED displays, </br> control systems and individual solutions.
                    </p>
                    <ul class="social-network"></ul>
                </div>

                <section class="footer-link">
                    <h1 class="footer-link__heading">quick links</h1>
                    <nav class="footer-navigation">
                        <ul class="footer-navigation__list"></ul>
                    </nav>
                </section>

                <section class="footer-contact">
                    <h1 class="footer-contact__heading">contact</h1>
                    <ul class="footer-contact__list"></ul>
                </section>

            </div>
        </div>
    </footer>

</body>

</html>
